name: acc-local

x-api-build: &api-build
  context: ..
  dockerfile: infra/Dockerfile
  target: api

x-api-environment: &api-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-acc}:${POSTGRES_PASSWORD:?Run local:configure}@postgres:5432/${POSTGRES_DB:-acc}
  SESSION_SECRET: ${SESSION_SECRET:?Run local:configure}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:55173}
  API_PORT: '53000'
  API_HOST: 0.0.0.0
  NODE_ENV: development

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run local:configure}
      POSTGRES_DB: ${POSTGRES_DB:-acc}
    ports: ['127.0.0.1:55432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run local:configure}
    ports: ['127.0.0.1:56379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: acc-api:local
    build: *api-build
    environment: *api-env
    command: ['node', 'packages/db/dist/migrate.js']
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
  bootstrap:
    image: acc-api:local
    build: *api-build
    environment:
      <<: *api-env
      ACC_LOCAL_DOCKER_BOOTSTRAP: '1'
    command: ['node', 'apps/api/dist/local-bootstrap.js']
    volumes: ['../.cache:/app/.cache']
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: 'no'
  api:
    image: acc-api:local
    build: *api-build
    environment:
      <<: *api-env
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run local:configure}@redis:6379
    ports: ['127.0.0.1:53000:53000']
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:53000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    restart: unless-stopped
  worker:
    image: acc-api:local
    build: *api-build
    environment:
      <<: *api-env
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run local:configure}@redis:6379
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-250}
    command: ['node', 'apps/api/dist/outbox/main.js']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
  ui:
    image: acc-ui:local
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: ui
    ports: ['127.0.0.1:55173:8080']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
